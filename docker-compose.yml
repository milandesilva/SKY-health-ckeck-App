services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: healthcheck
      POSTGRES_USER: healthcheck
      POSTGRES_PASSWORD: healthcheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcheck -d healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-docker-secret-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://healthcheck:healthcheck@db:5432/healthcheck
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
