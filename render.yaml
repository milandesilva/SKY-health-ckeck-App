# Optional Render Blueprint — connect this repo on render.com to deploy
services:
  - type: web
    name: healthcheck-web
    runtime: docker
    plan: free
    healthCheckPath: /accounts/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthcheck-db
          property: connectionString

databases:
  - name: healthcheck-db
    plan: free
