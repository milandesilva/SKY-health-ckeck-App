databases:
  - name: healthcheck-db
    plan: free
    databaseName: healthcheck
    user: healthcheck

services:
  - type: web
    name: healthcheck-web
    runtime: docker
    plan: free
    healthCheckPath: /accounts/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: healthcheck-db
          property: connectionString
