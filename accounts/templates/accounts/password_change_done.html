{% extends 'accounts/base.html' %}
<!-- Main content block displays a confirmation message after password change -->
{% block content %}
<div style="max-width:430px; margin:90px auto; text-align:center; padding:36px 32px; background:#fff; border-radius:16px; box-shadow:0 4px 30px #95dd8a22;">
    <h2 style="color:#1565c0; font-weight:700;">Password Changed!</h2>
    <p style="margin-top:18px; font-size:1.17em; color:#31804c;">
        Your password was changed successfully.<br>
        <!-- Link for user to return to their profile page -->
        <a href="{% url 'yourprofile' %}" style="color:#1976d2;text-decoration:underline;">Return to your profile</a>.
    </p>
</div>
{% endblock %}
